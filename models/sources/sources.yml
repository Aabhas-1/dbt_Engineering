version: 2

sources:
  - name: dbo
    database: dbt

    tables:
      - name: Product
        identifier: Product
        columns:
          - name: Product
            tests:
              - string_not_empty
        freshness:
          warn_after: { count: 1, period: day }  
          error_after: { count: 3, period: day }  
        loaded_at_field: UpdatedAtTimestamp2  
      - name: Region
        identifier: Region

      - name: Reseller
        identifier: Reseller

      - name: SalesPerson
        identifier: Salesperson

      - name: SalesPersonRegion
        identifier: SalespersonRegion

      - name: sales
        identifier: Sales

      - name: Targets
        identifier: Targets
